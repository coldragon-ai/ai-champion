<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17283f;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#10365d;color:white}header .inner{max-width:1160px;margin:auto;padding:25px 24px}header small{font-size:14px;color:#bddefb;font-weight:700;letter-spacing:.04em}h1{font-size:clamp(25px,3vw,34px);letter-spacing:-.045em;margin:6px 0 0}main{max-width:1160px;margin:30px auto 60px;padding:0 24px}.panel{background:white;border:1px solid #dbe4ef;border-radius:16px;box-shadow:0 6px 22px #183d6610}.controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(190px,1fr);gap:18px;padding:23px}.field label{display:block;font-size:15px;font-weight:700;margin-bottom:9px}.field input,.field select{width:100%;height:48px;border:1px solid #aebed1;border-radius:9px;padding:0 14px;background:white;color:#17283f;font:inherit;font-size:16px}.field input:focus,.field select:focus{outline:3px solid #b5d8ff;border-color:#1264ae}.results{margin-top:21px;overflow:hidden}.results-head{display:flex;justify-content:space-between;align-items:center;padding:21px 23px;border-bottom:1px solid #dbe4ef;gap:10px}.results-head h2{margin:0;font-size:20px;letter-spacing:-.03em}.count{font-size:16px;color:#41546a}.count strong{color:#075da9;font-size:21px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:15px}th{background:#eaf1f9;color:#36516d;font-weight:700;white-space:nowrap}th,td{padding:16px 20px;border-bottom:1px solid #e5ebf2}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f7faff}td:first-child{font-weight:700;font-size:16px;min-width:210px}td:nth-child(2) span{display:inline-block;background:#e9f2fc;color:#125b94;border-radius:6px;padding:4px 9px;font-weight:700}td:nth-child(4) .yes{color:#096a54;font-weight:700}td:nth-child(4) .no{color:#69778a}td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}.empty{padding:48px 18px;text-align:center;color:#536579;font-siz
